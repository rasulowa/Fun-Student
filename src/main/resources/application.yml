server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: student
  jpa:
    hibernate.ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/students_db
    username: postgres
    password: postgres
    hikari:
      schema: students_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema;
      connection-timeout: 10000
